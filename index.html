<!DOCTYPE html>
<html>
<head>
  <title>Ashh | Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      background: radial-gradient(circle at top, #1f1c2c, #928dab);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      overflow: hidden;
    }

    .container {
      text-align: center;
      animation: fadeIn 1.2s ease-in-out;
    }

    h1 {
      font-size: 52px;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    h1 span {
      color: #00f5a0;
    }

    p {
      font-size: 18px;
      color: #ddd;
      margin-bottom: 30px;
    }

    .btn {
      padding: 14px 30px;
      border-radius: 30px;
      border: none;
      background: linear-gradient(45deg, #00f5a0, #00d9f5);
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(0,245,160,0.6);
    }

    .glow {
      position: absolute;
      width: 300px;
      height: 300px;
      background: #00f5a0;
      filter: blur(150px);
      top: -100px;
      left: -100px;
      opacity: 0.3;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(30px);}
      to {opacity: 1; transform: translateY(0);}
    }
  </style>
</head>

<body>

<div class="glow"></div>

<div class="container">
  <h1>Hi, I'm <span>Ashh</span> 👋</h1>
  <p>MCA Student | Portfolio | Future Developer</p>
  <button class="btn" onclick="alert('Projects coming soon 🚀')">
    Explore My Work
  </button>
</div>

</body>
</html>
